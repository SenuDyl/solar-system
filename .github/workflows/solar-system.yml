name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/*"

env:
  MONGO_URI: ${{ vars.MONGO_URI }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    # strategy:
    #   matrix:
    #     node-version: [18, 20]
    #     os: [ubuntu-latest, windows-latest]
    #     exclude:
    #       - node-version: 20
    #         os: windows-latest
    strategy:
      matrix:
        node-version: [20]
        os: [ubuntu-latest]

    # Servive can be used to run a MongoDB instance for testing purposes.
    # A service is a separate container that runs alongside the job's main container,
    # allowing you to run dependencies like databases or other services needed for your tests.
    # Here, you can specify the image of your test database (e.g., MongoDB) and the ports to expose.

    services:
      mongo:
        image: mongo:non-prod
        ports:
          - 27017:27017

    # These environment variables will be available to all steps in the job.
    # They will take precedence over the global environment variables defined at the workflow/repo level,
    # allowing you to override them for this specific job if needed.

    env:
      # The mongo_uri is a local connection string that points to the MongoDB service running in the
      # container.
      MONGO_URI: "mongodb://localhost:27017/superData"
      MONGO_USERNAME: non-prod-username
      MONGO_PASSWORD: non-prod-password

    name: Unit Testing
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Node Modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        id: node-test
        run: npm test

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result
          path: test-results.xml

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    # Job container allows you to specify a Docker image that will be used as the
    # execution environment for all steps in the job.
    # We don't need to set up Node.js manually in this job since the container image (node:18)
    # already includes Node.js.

    container:
      image: node:18

    services:
      mongo:
        image: mongo:non-prod
        options: --name mongo

        # We don't need to expose the port to the host machine since the tests will run inside the container,
        # and they can access the MongoDB service using the internal network.

    env:
      # The mongo_uri now can use the service name (mongo) as the hostname,
      # which allows the tests to connect to the MongoDB service running in the container.
      MONGO_URI: "mongodb://mongo:27017/superData"
      MONGO_USERNAME: non-prod-username
      MONGO_PASSWORD: non-prod-password

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # - name: Setup NodeJS Version
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Code Coverage
        run: npm run coverage

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Report
          path: coverage/lcov-report
          retention-days: 5

  docker:
    name: Containerization
    runs-on: ubuntu-latest
    needs: [unit-testing, code-coverage]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        uses: docker/build-push-action@v3
        with:
          context: . # Search for Dockerfile in the root directory
          push: false
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

      - name: Test Docker Image
        run: |
          docker run --rm ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }} npm test

      - name: Push Docker Image
        uses: docker/build-push-action@v3
        with:
          context: . # Search for Dockerfile in the root directory
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/solar-system:${{ github.sha }}

  # Here we use a resuable workflow (reuse-deployment.yml)
  # to deploy the application to both development and production environments.
  # We have to pass secrets from the main workfow to the reusable one
  dev-deploy:
    if: contains(github.ref, 'feature/')
    needs: docker
    uses: ./.github/workflows/reuse-deployment.yml
    secrets:
      k8-kubeconfig: ${{ secrets.KUBE_CONFIG }}
      mongo-password: ${{ secrets.MONGO_PASSWORD }}
    with:
      mongo-uri: ${{ vars.MONGO_URI }}
      environment: development
      k8s-manifest-path: kubernetes/development/

  dev-integration-test:
    name: Integration Testing
    runs-on: ubuntu-latest
    needs: dev-deploy
    if: contains(github.ref, 'feature/')
    steps:
      - name: Test URL output using curl and JQ
        env:
          APP_INGRESS_HOST: ${{ steps.set-ingress-url.outputs.APP_INGRESS_HOST }}
        run: |
          echo $APP_INGRESS_HOST
          RESPONSE=$(curl -s http://$APP_INGRESS_HOST/live)
          echo "Response from the application: $RESPONSE"
          # Here we are using JQ to parse the JSON response and extract the value of the "status" field.
          STATUS=$(echo $RESPONSE | jq -r '.status')
          echo "Extracted status: $STATUS"
          if [ "$STATUS" != "ok" ]; then
            echo "Integration test failed: Expected status 'ok' but got '$STATUS'"
            exit 1
          else
            echo "Integration test passed: Status is 'ok'"
          fi

  prod-deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    uses: ./.github/workflows/reuse-deployment.yml
    secrets:
      k8-kubeconfig: ${{ secrets.KUBE_CONFIG }}
      mongo-password: ${{ secrets.MONGO_PASSWORD }}
    with:
      mongo-uri: ${{ vars.MONGO_URI }}
      environment: production
      k8s-manifest-path: kubernetes/production/

  prod-integration-test:
    if: github.ref == 'refs/heads/main'
    name: Integration Testing
    runs-on: ubuntu-latest
    needs: prod-deploy
    steps:
      - name: Test URL output using curl and JQ
        env:
          APP_INGRESS_HOST: ${{ steps.set-ingress-url.outputs.APP_INGRESS_HOST }}
        run: |
          echo $APP_INGRESS_HOST
          RESPONSE=$(curl -s http://$APP_INGRESS_HOST/live)
          echo "Response from the application: $RESPONSE"
          # Here we are using JQ to parse the JSON response and extract the value of the "status" field.
          STATUS=$(echo $RESPONSE | jq -r '.status')
          echo "Extracted status: $STATUS"
          if [ "$STATUS" != "ok" ]; then
            echo "Integration test failed: Expected status 'ok' but got '$STATUS'"
            exit 1
          else
            echo "Integration test passed: Status is 'ok'"
          fi

# Checkout github-actions-solar-system repostory, feature branch, yaml file
# After the workflow finishes successfully, you can merge the branch to the main branch by raising a PR
# After merging the PR, the prod-deploy and prod-integration-test jobs will be triggered, and the
# application will be deployed to the production environment.
# After the deployment, manual approval from one of the reviewers is required to proceed with the production deployment.
